services:
  # ----------------------------------------------------
  # BACKEND SERVICE (Express.js + Prisma + PostgreSQL)
  # ----------------------------------------------------
  - type: web
    name: haqms-backend
    env: node
    plan: free
    rootDir: backend
    # Install dependencies, generate Prisma client, and apply database migrations
    buildCommand: npm install && npx prisma generate && (npx prisma migrate deploy || npx prisma db push --skip-generate)
    startCommand: (node prisma/seed.js || true) && npm start
    envVars:
      # PostgreSQL database connection URL (linked to Render PostgreSQL instance)
      - key: DATABASE_URL
        fromDatabase:
          name: haqms-db
          property: connectionString
      # Automatically generate a secure random string for JWT signing
      - key: JWT_SECRET
        generateValue: true
      # Allow CORS requests from the frontend service
      - key: FRONTEND_URL
        value: https://haqms-frontend-wjzn.onrender.com
      - key: NODE_ENV
        value: production

  # ----------------------------------------------------
  # FRONTEND SERVICE (Next.js)
  # ----------------------------------------------------
  - type: web
    name: haqms-frontend
    env: node
    plan: free
    rootDir: frontend
    # Install dependencies and build the Next.js production bundle
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      # Point the frontend to the backend service API
      - key: NEXT_PUBLIC_API_URL
        value: https://haqms-backend-tz6y.onrender.com/api

# ----------------------------------------------------
# DATABASE SERVICE (Render Managed PostgreSQL)
# ----------------------------------------------------
databases:
  - name: haqms-db
    plan: free
    databaseName: haqms
    user: haqms_user
