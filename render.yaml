services:
  # ----------------------------------------------------
  # BACKEND SERVICE (Express.js + Prisma + PostgreSQL)
  # ----------------------------------------------------
  - type: web
    name: haqms-backend
    env: node
    plan: free
    rootDir: backend
    # Install dependencies, generate Prisma client, apply migrations, and seed the database
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma db push --accept-data-loss --skip-generate && (node prisma/seed.js || true) && npm start
    envVars:
      # PostgreSQL database connection URL
      - key: DATABASE_URL
        value: postgresql://postgres:postgres@localhost:5432/haqms?schema=public
      # Automatically generate a secure random string for JWT signing
      - key: JWT_SECRET
        generateValue: true
      # Allow CORS requests from the frontend service
      - key: FRONTEND_URL
        value: https://haqms-frontend-qk7k.onrender.com
      - key: NODE_ENV
        value: development

  # ----------------------------------------------------
  # FRONTEND SERVICE (Next.js)
  # ----------------------------------------------------
  - type: web
    name: haqms-frontend
    env: node
    plan: free
    rootDir: frontend
    # Install dependencies and build the Next.js production bundle
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      # Point the frontend to the backend service API
      - key: NEXT_PUBLIC_API_URL
        value: https://haqms-backend-6zzd.onrender.com/api
