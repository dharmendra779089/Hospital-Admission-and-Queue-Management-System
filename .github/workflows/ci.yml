name: HAQMS Full-Stack CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci --prefix frontend

      - name: Run ESLint
        run: npm run lint --prefix frontend

      - name: Verify Next.js Production Build
        run: npm run build --prefix frontend
        env:
          NEXT_PUBLIC_API_URL: https://haqms-backend-tz6y.onrender.com/api

  api-integration-tests:
    name: Backend API & End-to-End Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run 57-Point Automated Test Suite
        run: npm test
        env:
          TEST_BASE_URL: https://haqms-backend-tz6y.onrender.com
          TEST_FRONTEND_URL: https://haqms-frontend-wjzn.onrender.com
